experiment:
  name: libero_spatial_bc_gru_dinov2s_proprio_task
  seed: 0
  tags:
    - g5_diagnostic
    - bc_gru
    - dinov2s
    - proprio
    - task_conditioned
    - no_future_latent_loss

data:
  suite: libero_spatial
  dataset_root: env:LIBERO_DATASET_ROOT
  history_len: 4
  action_horizon: 4
  future_horizon: 4
  image_size: 128
  split:
    source: splits/libero_episode_split_seed20260528.json
    unit: episode
    train: []
    val: []
    test: []
  latent_dir: latents/libero_spatial/dinov2_vits14
  latent_format: hdf5
  latent_dim: 384

model:
  name: bc_gru_dinov2s_proprio_task
  visual_encoder: dinov2_vits14
  visual_latent_dim: 384
  model_id: facebook/dinov2-small
  revision: ed25f3a31f01632728cabb09d1542f84ab7b0056
  preprocessing_id: AutoImageProcessor.from_pretrained
  output_token: cls
  text_encoder: stub
  temporal_adapter: bc_gru
  hidden_dim: 256
  num_tasks: 9

training:
  batch_size: 32
  epochs: 100
  optimizer: adamw
  lr: 0.0003
  lambda_action: 1.0
  lambda_future: 0.0
  lambda_spike: 0.0
  grad_clip_norm: 1.0

output:
  output_dir: results/runs/libero_spatial_bc_gru_dinov2s_proprio_task
  save_best_by: val/action_mse

reproducibility:
  require_clean_git: true
  encoder_in_optimizer: false
  same_data: true
  same_split: true
  same_action_normalization: true
