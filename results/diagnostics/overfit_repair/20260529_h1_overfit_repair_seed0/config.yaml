experiment:
  name: libero_spatial_wam_gru_h1_overfit_debug
  seed: 0
  tags:
    - g5_diagnostic
    - single_demo_overfit
    - h1
    - split_gripper
    - no_future_latent_claim

data:
  suite: libero_spatial
  dataset_root: env:LIBERO_DATASET_ROOT
  history_len: 4
  action_horizon: 1
  future_horizon: 4
  image_size: 128
  split:
    source: splits/libero_episode_split_seed20260528.json
    unit: episode
    train: []
    val: []
    test: []
  latent_dir: latents/libero_spatial/dinov2_vits14
  latent_format: hdf5
  latent_dim: 384

model:
  name: wam_gru_dinov2s_h1_overfit_debug
  visual_encoder: dinov2_vits14
  visual_latent_dim: 384
  model_id: facebook/dinov2-small
  revision: ed25f3a31f01632728cabb09d1542f84ab7b0056
  preprocessing_id: AutoImageProcessor.from_pretrained
  output_token: cls
  text_encoder: stub
  temporal_adapter: wam_gru
  hidden_dim: 256
  dropout: 0.0
  action_head_type: split_gripper

training:
  batch_size: 64
  epochs: 1000
  optimizer: adamw
  lr: 0.001
  lr_sweep: [0.0003, 0.001, 0.003]
  weight_decay: 0.0
  scheduler: none
  early_stopping: false
  lambda_action: 1.0
  lambda_future: 0.0
  lambda_spike: 0.0
  grad_clip_norm: null

normalization:
  actions:
    mode: none

output:
  output_dir: results/diagnostics/overfit_repair
  save_best_by: train/action_mse

reproducibility:
  require_clean_git: false
  encoder_in_optimizer: false
  same_data: true
  same_split: true
  same_action_normalization: true
  same_seed_set: [0]
